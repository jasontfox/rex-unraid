name: Report container smoke tests

on:
  workflow_run:
    workflows: [Container image]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  identify:
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify open same-repository pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report_smoke_test.py resolve >> "$GITHUB_OUTPUT"

  comment:
    needs: identify
    if: needs.identify.outputs.number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: container-smoke-comment-${{ needs.identify.outputs.number }}
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download smoke evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: smoke-results-${{ github.event.workflow_run.run_attempt }}
          path: evidence
      - name: Update smoke comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.identify.outputs.number }}
        run: python3 scripts/report_smoke_test.py publish "$PR_NUMBER" evidence
