name: Container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build image
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the Unraid image
        run: |
          version=$(python3 scripts/image_version.py)
          docker build --platform linux/amd64 --tag "rex-unraid:$version" .

  publish:
    name: Build main image and publish merged PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-release-${{ github.sha }}
    outputs:
      image: ${{ steps.release.outputs.image }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the Unraid image
        id: image
        run: |
          version=$(python3 scripts/image_version.py)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image" .
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Confirm this commit was merged through a pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -rs --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '
              [.[][] | select(.merged_at != null and .base.ref == "main" and
                .base.repo.full_name == $repository and .merge_commit_sha == $sha)][0].number // empty')
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
          if [[ -z "$number" ]]; then
            echo 'Main image built. This commit did not match a merged pull request.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to GitHub Container Registry
        id: release
        if: steps.merge.outputs.number != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            revision=$(docker pull "$IMAGE" >&2 &&
              docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "Image version $IMAGE already belongs to another commit." >&2
              exit 1
            fi
            printf 'Image `%s` was already published for this commit.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          else
            docker push "$IMAGE"
            printf 'Published `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
          fi
          printf 'image=%s\n' "$IMAGE" >> "$GITHUB_OUTPUT"

  latest:
    name: Update the latest image tag
    needs: publish
    if: needs.publish.outputs.image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: container-release-latest
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote the published image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo 'Skipped latest because this build is no longer the tip of main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="${IMAGE%:*}:latest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$latest"
          docker push "$latest"
          printf 'Published `%s` from `%s`.\n' "$latest" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
