name: Container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.archive-upload.outputs.artifact-id }}
      image: ${{ steps.image.outputs.ref }}
      image-id: ${{ steps.archive.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run container smoke suite
        id: image
        run: |
          version=$(python3 scripts/image_version.py)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          mkdir -p smoke-results
          git rev-parse HEAD > smoke-results/smoke-sha
          python3 scripts/smoke_test.py --image "$image" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$(cat smoke-results/smoke-sha)" \
            --label "org.opencontainers.image.version=$version"
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Upload JUnit and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-results-${{ github.run_attempt }}
          path: smoke-results/
          if-no-files-found: error
          retention-days: 7
      - name: Save tested release image
        if: github.event_name == 'push'
        id: archive
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          tested_id=$(cat smoke-results/image-id)
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$tested_id"
          mkdir release
          docker save "$IMAGE" -o release/image.tar
          (cd release && sha256sum image.tar > image.tar.sha256)
          printf 'image-id=%s\n' "$tested_id" >> "$GITHUB_OUTPUT"
      - name: Upload tested release image
        if: github.event_name == 'push'
        id: archive-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish tested image from merged PR
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-release-${{ needs.build.outputs.image }}
      queue: max
    outputs:
      image: ${{ steps.release.outputs.image }}
      digest: ${{ steps.release.outputs.digest }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Confirm this commit was merged through a pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -rs --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '
              [.[][] | select(.merged_at != null and .base.ref == "main" and
                .base.repo.full_name == $repository and .merge_commit_sha == $sha)][0].number // empty')
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
          if [[ -z "$number" ]]; then
            echo 'Main image built. This commit did not match a merged pull request.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Download tested image
        if: steps.merge.outputs.number != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release
      - name: Publish to GitHub Container Registry
        id: release
        if: steps.merge.outputs.number != ''
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build.outputs.image }}
          TESTED_ID: ${{ needs.build.outputs.image-id }}
        run: |
          (cd release && sha256sum -c image.tar.sha256)
          docker load --input release/image.tar
          test "$(docker image inspect --format '{{.Id}}' "$IMAGE")" = "$TESTED_ID"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$GITHUB_SHA"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! docker buildx imagetools inspect --raw "$IMAGE" > manifest.json 2> registry-error; then
            if ! grep -Fxq "ERROR: $IMAGE: not found" registry-error && ! grep -Fq 'manifest unknown' registry-error; then
              cat registry-error >&2
              exit 1
            fi
            docker push "$IMAGE"
            docker buildx imagetools inspect --raw "$IMAGE" > manifest.json
          fi
          test "$(jq -er '.config.digest' manifest.json)" = "$TESTED_ID"
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest')
          docker buildx imagetools inspect --raw "${IMAGE%:*}@$digest" | jq -e --arg id "$TESTED_ID" '.config.digest == $id'
          printf 'image=%s\ndigest=%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published or verified `%s@%s`.\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

  latest:
    name: Update the latest image tag
    needs: publish
    if: needs.publish.outputs.image != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: container-release-latest
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - name: Promote the published image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$GITHUB_SHA" != "$main_sha" ]]; then
            echo 'Skipped latest because this build is no longer the tip of main.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          latest="${IMAGE%:*}:latest"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --prefer-index=false --tag "$latest" "${IMAGE%:*}@$DIGEST"
          test "$(docker buildx imagetools inspect "$latest" --format '{{json .Manifest}}' | jq -er '.digest')" = "$DIGEST"
          printf 'Published `%s` from `%s`.\n' "$latest" "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
