name: Container image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build image
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the Unraid image
        id: image
        run: |
          version=$(python3 scripts/image_version.py)
          docker build --platform linux/amd64 --tag "rex-unraid:$version" .
          printf 'local=rex-unraid:%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Smoke-test rootless Podman
        env:
          IMAGE: ${{ steps.image.outputs.local }}
        run: |
          workspace="$RUNNER_TEMP/podman-workspace"
          sudo install -d -m 0700 -o 1000 -g 100 "$workspace"
          docker run --rm --user 1000:100 --entrypoint /bin/sh \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER \
            --cap-add KILL --cap-add NET_BIND_SERVICE --cap-add SETGID --cap-add SETUID \
            --cap-add SYS_CHROOT --cap-add AUDIT_WRITE \
            --security-opt "seccomp=$PWD/container/codex-seccomp.json" \
            --security-opt apparmor=unconfined --security-opt systempaths=unconfined \
            --mount "type=bind,src=$workspace,dst=/workspace" \
            --mount "type=bind,src=$PWD,dst=/src,readonly" \
            --tmpfs /run/user/1000:uid=1000,gid=100,mode=0700 \
            --env XDG_RUNTIME_DIR=/run/user/1000 "$IMAGE" -ec '
              test "$(id -u)" = 1000
              podman --version
              podman --storage-driver=vfs run \
                --rm --cgroups=disabled --network=none --volume /workspace:/work:rw \
                docker.io/library/alpine:3.22 sh -ec "echo rootless > /work/probe.txt"
              test "$(cat /workspace/probe.txt)" = rootless
              cd /src
              podman --storage-driver=vfs build --network=host --platform linux/amd64 \
                --tag localhost/rex-unraid:dev .
              podman --storage-driver=vfs run --rm --cgroups=disabled --network=none \
                --entrypoint /bin/sh localhost/rex-unraid:dev -ec "rex version; codex --version"
            '
      - name: Publish a pull request preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GHCR_TOKEN: ${{ github.token }}
          LOCAL_IMAGE: ${{ steps.image.outputs.local }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          preview="ghcr.io/${GITHUB_REPOSITORY,,}:pr-${PR_NUMBER}-${GITHUB_SHA:0:12}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if ! docker manifest inspect "$preview" >/dev/null 2>&1; then
            docker tag "$LOCAL_IMAGE" "$preview"
            docker push "$preview"
          fi
          printf 'Pull request preview `%s`\n' "$preview" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Build main image and publish merged PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: container-release-${{ github.sha }}
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the Unraid image
        id: image
        run: |
          version=$(python3 scripts/image_version.py)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$version"
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=$version" \
            --tag "$image" .
          printf 'ref=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Confirm this commit was merged through a pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" |
            jq -rs --arg sha "$GITHUB_SHA" --arg repository "$GITHUB_REPOSITORY" '
              [.[][] | select(.merged_at != null and .base.ref == "main" and
                .base.repo.full_name == $repository and .merge_commit_sha == $sha)][0].number // empty')
          printf 'number=%s\n' "$number" >> "$GITHUB_OUTPUT"
          if [[ -z "$number" ]]; then
            echo 'Main image built. This commit did not match a merged pull request.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish to GitHub Container Registry
        if: steps.merge.outputs.number != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            revision=$(docker pull "$IMAGE" >&2 &&
              docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "Image version $IMAGE already belongs to another commit." >&2
              exit 1
            fi
            printf 'Image `%s` was already published for this commit.\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker push "$IMAGE"
          printf 'Published `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
